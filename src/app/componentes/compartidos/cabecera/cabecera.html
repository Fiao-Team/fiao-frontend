<button class="boton-menu" type="button" aria-label="Abrir menú" (click)="abrirMenu.emit()">
  <app-icono nombre="menu" [tamano]="24" />
</button>

<div class="usuario">
  <button type="button" class="boton-usuario" aria-haspopup="menu"
          [attr.aria-expanded]="menuUsuarioAbierto()" (click)="menuUsuarioAbierto.set(!menuUsuarioAbierto())">
    <span class="datos">
      <strong>{{ sesion.sesion()?.nombres }}</strong>
      <small>{{ nombreRol() }}</small>
    </span>
    <span class="avatar">{{ iniciales() }}</span>
    <app-icono nombre="flecha-abajo" [tamano]="16" />
  </button>

  @if (menuUsuarioAbierto()) {
    <div class="menu-usuario" role="menu">
      <button type="button" role="menuitem"
              (click)="menuUsuarioAbierto.set(false); cambiarClave.abrir()">
        <app-icono nombre="llave" [tamano]="18" /> Cambiar contraseña
      </button>
      <button type="button" role="menuitem" class="peligro" (click)="sesion.cerrarSesion()">
        <app-icono nombre="salir" [tamano]="18" /> Cerrar sesión
      </button>
    </div>
  }
</div>

<app-cambiar-contrasena #cambiarClave />
